<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GM Logo</title>
  <style>
    :root {
      --bg: #e8e6e1;
      --ink: #0a0a0a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 35%, #f5f3ef 0%, var(--bg) 70%);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 40px 24px;
    }
    .badge {
      width: min(420px, 78vw);
      filter: drop-shadow(0 24px 48px rgba(0,0,0,.18));
      animation: rise 0.9s ease-out both;
    }
    .badge svg { width: 100%; height: auto; display: block; }
    .row {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      animation: rise 0.9s ease-out 0.15s both;
    }
    .chip {
      width: 110px;
      height: 110px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(0,0,0,.08);
    }
    .chip.on-dark { background: #111; }
    .chip svg { width: 72%; height: auto; display: block; }
    .label {
      text-align: center;
      letter-spacing: 0.4em;
      font-size: 13px;
      font-weight: 700;
      color: rgba(10,10,10,.45);
      text-transform: uppercase;
      animation: rise 0.9s ease-out 0.28s both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="badge" aria-label="GM logo">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
        <defs>
          <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#222"/>
            <stop offset="50%" stop-color="#0a0a0a"/>
            <stop offset="100%" stop-color="#000"/>
          </linearGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3a3a3a"/>
            <stop offset="55%" stop-color="#111"/>
            <stop offset="100%" stop-color="#000"/>
          </linearGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
          </filter>
        </defs>

        <polygon
          points="120,28 280,28 372,120 372,280 280,372 120,372 28,280 28,120"
          fill="url(#rim)"
          filter="url(#soft)"
        />
        <polygon
          points="132,48 268,48 352,132 352,268 268,352 132,352 48,268 48,132"
          fill="url(#face)"
        />
        <polygon
          points="142,62 258,62 338,142 338,258 258,338 142,338 62,258 62,142"
          fill="none"
          stroke="#f0f0f0"
          stroke-width="3.5"
          opacity="0.92"
        />

        <!-- GM -->
        <g fill="#f7f7f7">
          <!-- G -->
          <path d="
            M198 198
            h-56
            v36
            h84
            c2 52-28 86-80 86
            c-60 0-96-42-96-102
            s36-102 96-102
            c40 0 70 18 84 48
            l-32 18
            c-10-20-30-32-54-32
            c-38 0-60 28-60 68
            s22 68 60 68
            c22 0 38-10 44-30
            h-30
            V198
            Z
          " transform="translate(-54,0)"/>
          <!-- M -->
          <path d="
            M228 272
            V128
            h32
            l40 88
            40-88
            h32
            V272
            h-34
            V186
            l-32 68
            h-14
            l-32-68
            V272
            Z
          "/>
        </g>
      </svg>
    </div>

    <div class="row">
      <div class="chip">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <polygon points="120,28 280,28 372,120 372,280 280,372 120,372 28,280 28,120" fill="#0a0a0a"/>
          <g fill="#fff">
            <path d="M144 198 h-56 v36 h84 c2 52-28 86-80 86 c-60 0-96-42-96-102 s36-102 96-102 c40 0 70 18 84 48 l-32 18 c-10-20-30-32-54-32 c-38 0-60 28-60 68 s22 68 60 68 c22 0 38-10 44-30 h-30 V198 Z"/>
            <path d="M228 272 V128 h32 l40 88 40-88 h32 V272 h-34 V186 l-32 68 h-14 l-32-68 V272 Z"/>
          </g>
        </svg>
      </div>
      <div class="chip">
        <svg viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
          <text x="110" y="70" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="900" font-size="68" letter-spacing="-3" fill="#0a0a0a">GM</text>
        </svg>
      </div>
      <div class="chip on-dark">
        <svg viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
          <text x="110" y="70" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="900" font-size="68" letter-spacing="-3" fill="#f5f5f5">GM</text>
        </svg>
      </div>
    </div>

    <p class="label">GM · Black</p>
  </div>
</body>
</html>
